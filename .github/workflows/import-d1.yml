name: Import old catalog to D1

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import data.json.gz to Cloudflare D1
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          node <<'NODE'
          (async () => {
            const fs = require("fs");
            const zlib = require("zlib");

            const token = process.env.CF_API_TOKEN;
            const account = process.env.CF_ACCOUNT_ID;
            const database = process.env.CF_DATABASE_ID;

            if (!token || !account || !database) {
              throw new Error("Cloudflare secrets missing");
            }

            console.log("Reading data.json.gz...");

            const raw = zlib.gunzipSync(
              fs.readFileSync("data.json.gz")
            ).toString("utf8");

            const data = JSON.parse(raw);

            const items = Array.isArray(data)
              ? data
              : (data.items || []);

            console.log("Catalog items:", items.length);

            if (!items.length) {
              throw new Error(
                "No catalog items found in data.json.gz"
              );
            }

            const endpoint =
              `https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${database}/query`;

            async function query(sql, params = []) {
              const response = await fetch(endpoint, {
                method: "POST",
                headers: {
                  "Authorization": `Bearer ${token}`,
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  sql,
                  params
                })
              });

              const text = await response.text();

              if (!response.ok) {
                throw new Error(
                  `Cloudflare API HTTP ${response.status}: ${text}`
                );
              }

              let result;

              try {
                result = JSON.parse(text);
              } catch {
                throw new Error(
                  `Invalid Cloudflare API response: ${text}`
                );
              }

              if (!result.success) {
                throw new Error(
                  JSON.stringify(result.errors || result)
                );
              }

              return result;
            }

            function value(v) {
              if (
                v === undefined ||
                v === null ||
                v === ""
              ) {
                return null;
              }

              if (typeof v === "object") {
                return JSON.stringify(v);
              }

              return v;
            }

            const sql = `
              INSERT INTO movies (
                id,
                kind,
                slug,
                name,
                poster,
                backdrop,
                year,
                overview,
                rating,
                genres,
                runtime,
                imdb,
                tmdb,
                trailer,
                episodes,
                detail_url,
                links
              )
              VALUES (
                ?, ?, ?, ?, ?, ?, ?, ?, ?, ?,
                ?, ?, ?, ?, ?, ?, ?
              )
              ON CONFLICT(id) DO UPDATE SET
                kind = excluded.kind,
                slug = excluded.slug,
                name = excluded.name,
                poster = excluded.poster,
                backdrop = excluded.backdrop,
                year = excluded.year,
                overview = excluded.overview,
                rating = excluded.rating,
                genres = excluded.genres,
                runtime = excluded.runtime,
                imdb = excluded.imdb,
                tmdb = excluded.tmdb,
                trailer = excluded.trailer,
                episodes = excluded.episodes,
                detail_url = excluded.detail_url,
                links = excluded.links,
                updated_at = CURRENT_TIMESTAMP
            `;

            let imported = 0;

            for (const item of items) {
              const params = [
                value(item.id),
                value(item.kind),
                value(item.slug),
                value(item.name),
                value(item.poster),
                value(item.backdrop),
                value(item.year),
                value(item.overview),
                value(item.rating),
                value(item.genres),
                value(item.runtime),
                value(item.imdb),
                value(item.tmdb),
                value(item.trailer),
                value(item.episodes),
                value(
                  item.detail_url ||
                  (
                    item.kind && item.slug
                      ? `https://ctgmovies.com/${item.kind}/${item.slug}`
                      : null
                  )
                ),
                value(item.links)
              ];

              try {
                await query(sql, params);

                imported++;

                if (
                  imported % 25 === 0 ||
                  imported === items.length
                ) {
                  console.log(
                    `Imported ${imported} / ${items.length}`
                  );
                }

              } catch (error) {
                console.error(
                  `FAILED ITEM ${imported + 1}:`,
                  item.name || item.id
                );

                console.error(error.message);

                throw error;
              }
            }

            const check = await query(
              "SELECT COUNT(*) AS count FROM movies"
            );

            const count =
              check.result?.[0]?.results?.[0]?.count;

            console.log("D1 total rows:", count);
            console.log("IMPORT COMPLETE");

          })().catch(error => {
            console.error("IMPORT FAILED:", error);
            process.exit(1);
          });
          NODE
