name: Import old catalog to D1

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import data.json.gz to Cloudflare D1
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          node <<'NODE'
          (async () => {
            const fs = require("fs");
            const zlib = require("zlib");

            const token = process.env.CF_API_TOKEN;
            const account = process.env.CF_ACCOUNT_ID;
            const database = process.env.CF_DATABASE_ID;

            if (!token || !account || !database) {
              throw new Error("Cloudflare secrets missing");
            }

            console.log("Reading data.json.gz...");

            const raw = zlib.gunzipSync(
              fs.readFileSync("data.json.gz")
            ).toString("utf8");

            const data = JSON.parse(raw);

            const items = Array.isArray(data)
              ? data
              : (data.items || []);

            console.log("Catalog items:", items.length);

            if (!items.length) {
              throw new Error("No catalog items found");
            }

            function sqlValue(v) {
              if (
                v === undefined ||
                v === null ||
                v === ""
              ) {
                return "NULL";
              }

              if (
                typeof v === "number" &&
                Number.isFinite(v)
              ) {
                return String(v);
              }

              if (typeof v === "boolean") {
                return v ? "1" : "0";
              }

              const value =
                typeof v === "object"
                  ? JSON.stringify(v)
                  : String(v);

              return "'" +
                value
                  .replace(/\\/g, "\\\\")
                  .replace(/'/g, "''") +
                "'";
            }

            const endpoint =
              `https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${database}/query`;

            async function query(sql) {
              const response = await fetch(endpoint, {
                method: "POST",
                headers: {
                  "Authorization": `Bearer ${token}`,
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({ sql })
              });

              const text = await response.text();

              if (!response.ok) {
                throw new Error(
                  `Cloudflare API HTTP ${response.status}: ${text}`
                );
              }

              const result = JSON.parse(text);

              if (!result.success) {
                throw new Error(
                  JSON.stringify(result.errors || result)
                );
              }

              return result;
            }

            let imported = 0;

            for (const item of items) {

              const row = [
                item.id || null,
                item.kind || null,
                item.slug || null,
                item.name || null,
                item.poster || null,
                item.backdrop || null,
                item.year ?? null,
                item.overview || null,
                item.rating ?? null,
                item.genres ?? null,
                item.runtime ?? null,
                item.imdb || null,
                item.tmdb || null,
                item.trailer || null,
                item.episodes ?? null,
                item.detail_url ||
                  (
                    item.kind && item.slug
                      ? `https://ctgmovies.com/${item.kind}/${item.slug}`
                      : null
                  ),
                item.links ?? null
              ];

              const sql = `
                INSERT INTO movies
                (
                  id,
                  kind,
                  slug,
                  name,
                  poster,
                  backdrop,
                  year,
                  overview,
                  rating,
                  genres,
                  runtime,
                  imdb,
                  tmdb,
                  trailer,
                  episodes,
                  detail_url,
                  links
                )
                VALUES (
                  ${row.map(sqlValue).join(",")}
                )
                ON CONFLICT(id) DO UPDATE SET
                  kind=excluded.kind,
                  slug=excluded.slug,
                  name=excluded.name,
                  poster=excluded.poster,
                  backdrop=excluded.backdrop,
                  year=excluded.year,
                  overview=excluded.overview,
                  rating=excluded.rating,
                  genres=excluded.genres,
                  runtime=excluded.runtime,
                  imdb=excluded.imdb,
                  tmdb=excluded.tmdb,
                  trailer=excluded.trailer,
                  episodes=excluded.episodes,
                  detail_url=excluded.detail_url,
                  links=excluded.links,
                  updated_at=CURRENT_TIMESTAMP
              `;

              try {
                await query(sql);
                imported++;

                if (
                  imported % 25 === 0 ||
                  imported === items.length
                ) {
                  console.log(
                    `Imported ${imported} / ${items.length}`
                  );
                }

              } catch (error) {
                console.error(
                  `FAILED ITEM ${imported + 1}:`,
                  item.name || item.id
                );

                console.error(error.message);

                throw error;
              }
            }

            const check = await query(
              "SELECT COUNT(*) AS count FROM movies"
            );

            const count =
              check.result?.[0]?.results?.[0]?.count;

            console.log("D1 total rows:", count);
            console.log("IMPORT COMPLETE");

          })().catch(error => {
            console.error("IMPORT FAILED:", error);
            process.exit(1);
          });
          NODE
